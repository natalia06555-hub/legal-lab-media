name: kling-avatar
# Оживляет маскота: картинка + озвучка -> видео с липсинком (Kling Avatar API).
# Задание: inbox/avatar/<имя>.json  {"image": "<url>", "audio": "<url>", "out": "<путь .mp4 в репо>", "prompt": "...", "mode": "std"}
# Ключ: секрет репозитория KLING_API_KEY.
on:
  push:
    paths: ["inbox/avatar/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  avatar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate
        env:
          KEY: ${{ secrets.KLING_API_KEY }}
        run: |
          set -e
          API=https://api-singapore.klingai.com/v1/videos/avatar/image2video
          shopt -s nullglob
          for f in inbox/avatar/*.json; do
            body=$(jq -c '{image: .image, sound_file: .audio, mode: (.mode // "std"), prompt: (.prompt // "")}' "$f")
            out=$(jq -r .out "$f")
            id=$(jq -r '.task_id // empty' "$f")
            if [ -z "$id" ]; then
              resp=$(curl -sS -X POST "$API" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d "$body")
              echo "$resp" | head -c 400; echo
              id=$(echo "$resp" | jq -r '.data.task_id // empty')
            else
              echo "reuse task $id"; resp=""
            fi
            if [ -z "$id" ]; then echo "FAIL create $f"; mkdir -p "$(dirname "$out")"; echo "$resp" > "${out%.mp4}.error.json"; git rm -q "$f"; continue; fi
            for i in $(seq 1 120); do
              sleep 10
              st=$(curl -sS "$API/$id" -H "Authorization: Bearer $KEY")
              s=$(echo "$st" | jq -r '.data.task_status')
              echo "$i $s"
              if [ "$s" = "succeed" ]; then
                url=$(echo "$st" | jq -r '.data.task_result.videos[0].url')
                mkdir -p "$(dirname "$out")"; curl -sSL -o "$out" "$url"; echo "ok $out"; break
              fi
              if [ "$s" = "failed" ]; then mkdir -p "$(dirname "$out")"; echo "$st" > "${out%.mp4}.error.json"; break; fi
            done
            git rm -q "$f"
          done
      - name: Commit
        run: |
          git config user.name "legal-lab-media-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Видео маскота от Kling"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; sleep 5; done
