name: cf-image
# Сцена дня через Cloudflare Workers AI (FLUX.2 klein, бесплатно 10 000 нейронов в день ≈ 5–6 картинок).
# Запасной вариант, когда в Canva кончился лимит генераций.
# Задание: inbox/cf-image/<имя>.json
#   {"prompt": "...", "refs": ["<путь в репо или https-url фото героини>", ...до 4],
#    "out": "media/scenes/ГГГГ-ММ-ДД.jpg", "width": 1088, "height": 1360,
#    "model": "flux-2-klein-9b" (по умолчанию), "seed": 29 (необязательно)}
# Проверено 29.10: 9b + ОДИН образец (media/refs/heroine_face.jpg) — лучшее качество; 9b + два образца даёт AiError 3043; 4b держит и два.
# Образцы — не больше 500 px по стороне (у модели лимит < 512x512); готовые: media/refs/heroine_face.jpg, heroine_outfit.jpg.
# Секреты: CF_ACCOUNT_ID, CF_API_TOKEN.
on:
  push:
    paths: ["inbox/cf-image/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate
        env:
          ACC: ${{ secrets.CF_ACCOUNT_ID }}
          TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -e
          shopt -s nullglob
          for f in inbox/cf-image/*.json; do
            out=$(jq -r .out "$f")
            model=$(jq -r '.model // "flux-2-klein-9b"' "$f")
            args=(--form "prompt=$(jq -r .prompt "$f")"
                  --form "width=$(jq -r '.width // 1088' "$f")"
                  --form "height=$(jq -r '.height // 1360' "$f")")
            seed=$(jq -r '.seed // empty' "$f"); [ -n "$seed" ] && args+=(--form "seed=$seed")
            i=0
            for r in $(jq -r '.refs[]? // empty' "$f"); do
              tmp=$(mktemp --suffix=.jpg)
              case "$r" in http*) curl -sSL -o "$tmp.src" "$r";; *) cp "$r" "$tmp.src";; esac
              mv "$tmp.src" "$tmp"   # образцы должны быть меньше 512x512 — готовые лежат в media/refs/
              args+=(--form "input_image_$i=@$tmp;type=image/jpeg"); i=$((i+1))
            done
            mkdir -p "$(dirname "$out")"
            code=$(curl -sS -o /tmp/resp -w '%{http_code} %{content_type}' -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$ACC/ai/run/@cf/black-forest-labs/$model" \
              -H "Authorization: Bearer $TOKEN" "${args[@]}")
            echo "response: $code"
            case "$code" in
              200\ image/*) cp /tmp/resp "$out"; echo "ok $out";;
              200*) img=$(jq -r '.result.image // empty' /tmp/resp)
                    if [ -n "$img" ]; then echo "$img" | base64 -d > "$out"; echo "ok $out"
                    else head -c 600 /tmp/resp > "${out%.*}.error.json"; fi;;
              *) head -c 600 /tmp/resp > "${out%.*}.error.json"; cat "${out%.*}.error.json"; echo;;
            esac
            git rm -q "$f"
          done
      - name: Commit
        run: |
          git config user.name "legal-lab-media-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Сцена дня от Cloudflare"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; sleep 5; done
